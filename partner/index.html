<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Garda Unica — Per cantine e frantoi</title>
<!-- /partner/ (mit Slash) leitet auf /partner (partner.html) weiter; Query-Parameter bleiben erhalten. -->
<meta http-equiv="refresh" content="0; url=/partner">
<link rel="canonical" href="https://www.gardaunica.com/partner">
<script>
  // Loop-Schutz: nur weiterleiten, wenn wir nicht ohnehin schon auf /partner sind.
  if (location.pathname !== "/partner") {
    location.replace("/partner" + location.search + location.hash);
  }
</script>
</head>
<body>
<p>Reindirizzamento a <a href="/partner">gardaunica.com/partner</a> …</p>
</body>
</html>
